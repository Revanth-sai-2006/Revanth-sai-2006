<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050816"/><stop offset="60%" stop-color="#0b1230"/><stop offset="100%" stop-color="#101a44"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8298FF"><animate attributeName="stop-color" values="#8298FF;#64DCC5;#A78BFA;#8298FF" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#64DCC5"><animate attributeName="stop-color" values="#64DCC5;#A78BFA;#8298FF;#64DCC5" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366F1" stop-opacity=".55"/><stop offset="100%" stop-color="#22D3EE" stop-opacity=".45"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8298FF" stop-opacity=".45"/><stop offset="100%" stop-color="#8298FF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="r"><rect width="900" height="260" rx="22"/></clipPath>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#8298FF" stroke-opacity=".07"/>
    </pattern>
  </defs>
  <style>
    .t{font:800 46px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:.5px}
    .s{font:500 17px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#c7d2fe;letter-spacing:2.5px}
    .c{font:600 12px 'Fira Code',Consolas,monospace;fill:#64DCC5}
    .in{opacity:0;animation:in 1.1s ease-out forwards}
    .d1{animation-delay:.25s}.d2{animation-delay:.7s}.d3{animation-delay:1.1s}
    @keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .tw{animation:tw 3s ease-in-out infinite}
    @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
  </style>
  <g clip-path="url(#r)">
    <rect width="900" height="260" fill="url(#bg)"/>
    <rect width="900" height="260" fill="url(#grid)"/>
    <circle cx="450" cy="118" r="190" fill="url(#glow)">
      <animate attributeName="r" values="170;205;170" dur="6s" repeatCount="indefinite"/>
    </circle>
    <!-- orbit rings -->
    <g fill="none" stroke-width="1.2">
      <ellipse cx="450" cy="118" rx="330" ry="78" stroke="#8298FF" stroke-opacity=".22" transform="rotate(-6 450 118)"/>
      <ellipse cx="450" cy="118" rx="270" ry="58" stroke="#64DCC5" stroke-opacity=".18" transform="rotate(5 450 118)" stroke-dasharray="4 8"/>
    </g>
    <circle r="5" fill="#64DCC5">
      <animateMotion dur="9s" repeatCount="indefinite" path="M120,118 a330,78 0 1,0 660,0 a330,78 0 1,0 -660,0" rotate="auto"/>
    </circle>
    <circle r="3.5" fill="#A78BFA">
      <animateMotion dur="13s" repeatCount="indefinite" begin="-4s" path="M180,118 a270,58 0 1,1 540,0 a270,58 0 1,1 -540,0"/>
    </circle>
    <!-- stars -->
    <g fill="#e0e7ff">
      <circle class="tw" cx="70" cy="40" r="1.6"/><circle class="tw" style="animation-delay:.6s" cx="160" cy="190" r="1.2"/>
      <circle class="tw" style="animation-delay:1.2s" cx="260" cy="30" r="1.4"/><circle class="tw" style="animation-delay:1.8s" cx="640" cy="36" r="1.6"/>
      <circle class="tw" style="animation-delay:.9s" cx="790" cy="70" r="1.3"/><circle class="tw" style="animation-delay:2.2s" cx="830" cy="180" r="1.5"/>
      <circle class="tw" style="animation-delay:1.5s" cx="560" cy="210" r="1.1"/><circle class="tw" style="animation-delay:.3s" cx="40" cy="150" r="1.2"/>
    </g>
    <!-- waves -->
    <path fill="url(#wave)" opacity=".5">
      <animate attributeName="d" dur="14s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"
        values="M0 215Q225 185 450 212T900 205V260H0Z;M0 205Q225 235 450 200T900 218V260H0Z;M0 215Q225 185 450 212T900 205V260H0Z"/>
    </path>
    <path fill="url(#wave)" opacity=".35">
      <animate attributeName="d" dur="10s" repeatCount="indefinite" calcMode="spline" keyTimes="0;.5;1" keySplines=".45 0 .55 1;.45 0 .55 1"
        values="M0 228Q225 245 450 225T900 232V260H0Z;M0 236Q225 215 450 238T900 224V260H0Z;M0 228Q225 245 450 225T900 232V260H0Z"/>
    </path>
    <text class="c in" x="450" y="58" text-anchor="middle">&lt;/&gt; hello, world</text>
    <text class="t in d1" x="450" y="122" text-anchor="middle" fill="url(#brand)">Vedantam Revanth Sai</text>
    <text class="s in d2" x="450" y="160" text-anchor="middle">AI &amp; DATA ENGINEER  •  LLM DEVELOPER  •  FULL-STACK</text>
    <rect class="in d3" x="390" y="176" width="120" height="3" rx="1.5" fill="url(#brand)">
      <animate attributeName="width" values="40;120;40" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="x" values="430;390;430" dur="4s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
